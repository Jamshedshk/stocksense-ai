services:
  - type: web
    name: stocksense-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://stocksense-ai-fujexdc8f-jd-e935.vercel.app
